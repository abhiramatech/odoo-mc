name: Deploy to Windows Server (git pull)

on:
  workflow_dispatch:        # jalankan manual dulu: tab Actions -> Run workflow
  # push:                   # aktifkan setelah uji manual berhasil
  #   branches: [main]

concurrency:
  group: deploy-windows-server
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, windows, odoo17]
    steps:
      - name: Update clone repo (addons_path menunjuk ke folder ini)
        shell: powershell
        env:
          REPO: 'C:\Program Files\Odoo 17.0.20250624\server\POSVIT\odoo-mc'
          BRANCH: main
        run: |
          # git menulis progres ke stderr; jangan dianggap error (kegagalan dicek lewat exit code)
          $ErrorActionPreference = 'Continue'
          $fwd = $env:REPO -replace '\\', '/'
          if (-not ((git config --global --get-all safe.directory) -contains $fwd)) { git config --global --add safe.directory $fwd }
          git -C $env:REPO fetch origin "+refs/heads/${env:BRANCH}:refs/remotes/origin/${env:BRANCH}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $env:REPO reset --hard "origin/${env:BRANCH}"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $env:REPO log -1 --oneline

      - name: Restart Odoo service
        shell: powershell
        env:
          SERVICE: odoo-server-17.0
        run: |
          Restart-Service -Name $env:SERVICE -Force
          (Get-Service -Name $env:SERVICE).WaitForStatus('Running', '00:01:00')